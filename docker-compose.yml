
services:
 
  # 1. Laravel Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: smartfin-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - smartfin-net
    mem_limit: 1024m
    
  queue:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: smartfin-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - db
    networks:
      - smartfin-net
    mem_limit: 512m
    
  n8n:
    image: n8nio/n8n
    container_name: n8n_local
    restart: unless-stopped
    ports:
      # Connects your computer's port 5678 to the container's port 5678
      - "5678:5678"
    volumes:
      # Creates a persistent "thermos" to save your workflows
      - n8n_data_local:/home/node/.n8n
    environment:
      # Tells n8n to use the free and simple built-in database
      - DB_TYPE=sqlite
    networks:
      - smartfin-net
    mem_limit: 1024m


  # 2. Nginx Web Server Service
  web:
    image: nginx:alpine
    container_name: smartfin-web
    restart: unless-stopped
    ports:
      - "8000:80" 
      - "5173:5173"
      - "8080:8080"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - smartfin-net
    depends_on:
      - app

  # 3. MySQL Database Service
  db:
    image: mysql:8.0
    container_name: smartfin-db
    restart: unless-stopped
    ports:
      - "3306:3306" # Expose MySQL to your host machine (optional)
    environment:
      MYSQL_DATABASE: smartfin
      MYSQL_USER: smartfin_user
      MYSQL_PASSWORD: 12345
      MYSQL_ROOT_PASSWORD: 12345
    volumes:
      - smartfin-db-data:/var/lib/mysql
    networks:
      - smartfin-net
    mem_limit: 2048m

# Define the network
networks:
  smartfin-net:
    driver: bridge

# Define the persistent volume for the database
volumes:
  smartfin-db-data:
    driver: local
  n8n_data_local:

