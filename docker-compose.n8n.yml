version: '3.7'

services:
  n8n:
    image: n8nio/n8n
    container_name: n8n_local
    restart: unless-stopped
    ports:
      # Connects your computer's port 5678 to the container's port 5678
      - "5678:5678"
    volumes:
      # Creates a persistent "thermos" to save your workflows
      - n8n_data_local:/home/node/.n8n
    environment:
      # Tells n8n to use the free and simple built-in database
      - DB_TYPE=sqlite
      
volumes:
  # This officially creates the "thermos"
  n8n_data_local: